[project]
name = "spidory"
version = "0.1.0"
description = "Dory-style looped transformer with self-organising experts and learned run counts"
requires-python = ">=3.12"
dependencies = ["torch>=2.15", "datasets>=3.0", "tokenizers>=0.20", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spidory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
